<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Dynamic Meta Viewport Tag -->
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edge to Edge Viewport Demo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --indirect-safe-top: env(safe-area-inset-top, 0px);
      --indirect-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: white;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Highlighted Pink Top Header Box */
    #top-header {
      width: 100%;
      background: #fce7f3;
      border-bottom: 1px dashed #f472b6;
      z-index: 1000;
      display: none;
      transition: padding-top 0.2s ease;
    }

    #top-header.header-visible {
      display: block;
    }

    #top-header.pos-fixed {
      position: fixed;
      top: 0;
      left: 0;
    }

    #top-header.pos-sticky {
      position: sticky;
      top: 0;
    }

    .header-content {
      padding: 6px 16px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #db2777;
      text-transform: uppercase;
    }

    /* Top Safe Area Paths */
    #top-header.path-fast {
      padding-top: env(safe-area-inset-top, 0px);
    }

    #top-header.path-slow {
      padding-top: calc(var(--indirect-safe-top) + 0px);
    }

    /* Highlighted Pink Bottom Footer Box */
    #bottom-footer {
      width: 100%;
      background: #fce7f3;
      border-top: 1px dashed #f472b6;
      z-index: 1000;
      display: none;
      transition: padding-bottom 0.2s ease;
      margin-top: auto;
    }

    #bottom-footer.footer-visible {
      display: block;
    }

    #bottom-footer.pos-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
    }

    #bottom-footer.pos-sticky {
      position: sticky;
      bottom: 0;
    }

    /* Bottom Safe Area Paths */
    #bottom-footer.path-fast {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #bottom-footer.path-slow {
      padding-bottom: calc(var(--indirect-safe-bottom) + 0px);
    }

    .footer-content {
      padding: 14px 16px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #db2777;
      text-transform: uppercase;
    }

    /* Main Content Container */
    .main-container {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* When no top header is present, ensure main container respects top safe area */
    body:not(:has(#top-header.header-visible)) .main-container {
      padding-top: max(24px, env(safe-area-inset-top, 0px));
    }

    /* Same for bottom footer */
    body:not(:has(#bottom-footer.footer-visible)) .main-container {
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }

    .hero-section {
      margin-top: 8px;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: #475569;
      line-height: 1.5;
    }

    /* Cards */
    .card {
      background: #efefef;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .placeholder-bar {
      height: 12px;
      background: #a9c0df;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .placeholder-bar.short {
      width: 55%;
    }

    .placeholder-bar.medium {
      width: 80%;
    }

    .placeholder-bar.full {
      width: 100%;
    }

    /* Controls Panel */
    .controls-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 14px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }

    select {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .debug-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #334155;
      line-height: 1.6;
    }

    .code-snippet {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #0f172a;
      white-space: pre-wrap;
      margin-top: 6px;
    }

    .highlight {
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <header id="top-header" class="header-visible pos-fixed path-fast">
    <div class="header-content">
      HEADER CONTENT
    </div>
  </header>

  <main class="main-container" id="main-content">
    <div style="height: 32px;" id="header-spacer"></div>

    <section class="hero-section">
      <h1 class="hero-title">Edge to edge demo</h1>
      <p class="hero-subtitle">
        Edge to edge demo.
      </p>
    </section>

    <!-- SECTION 1: Viewport Controls Card -->
    <div class="card">
      <h2 class="controls-title">1. Viewport controls</h2>
      <div class="control-group">
        <label for="viewport-fit-select">Viewport-fit value</label>
        <select id="viewport-fit-select">
          <option value="cover" selected>cover</option>
          <option value="auto">auto</option>
          <option value="contain">contain</option>
        </select>
      </div>
      <div style="margin-top: 14px;">
        <label>Status Inspector (Viewport)</label>
        <div class="debug-box">
          <div>Meta tag: <span id="meta-tag-output" class="highlight"></span></div>
        </div>
      </div>
      </div>

    <!-- SECTION 2: Top Header Controls Card -->
    <div class="card">
      <h2 class="controls-title">2. Top header controls</h2>
      <div class="control-grid">
        <div class="control-group">
          <label for="header-anchor-select">Top header position</label>
          <select id="header-anchor-select">
            <option value="fixed" selected>fixed</option>
            <option value="sticky">sticky</option>
            <option value="none">none</option>
          </select>
        </div>

        <div class="control-group">
          <label for="safe-area-path-select-top">Safe area inset path</label>
          <select id="safe-area-path-select-top">
            <option value="fast" selected>Fast path (env)</option>
            <option value="slow-css">Slow path A (CSS var)</option>
            <option value="slow-js">Slow path B (JS layout)</option>
          </select>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <label>Status Inspector (Top)</label>
        <div class="debug-box">
          <div>Active path: <span id="path-mode-output-top" class="highlight"></span></div>
          <div>Header top padding: <span id="header-padding-output-top" class="highlight"></span></div>
        </div>
        <div style="margin-top: 12px;">
          <label>Implementation details (Top)</label>
          <div class="code-snippet" id="code-snippet-output-top"></div>
        </div>
      </div>
    </div>

    <!-- SECTION 3: Bottom Header Controls Card -->
    <div class="card">
      <h2 class="controls-title">3. Bottom header controls</h2>
      <div class="control-grid">
        <div class="control-group">
          <label for="footer-anchor-select">Bottom header position</label>
          <select id="footer-anchor-select">
            <option value="fixed" selected>fixed</option>
            <option value="sticky">sticky</option>
            <option value="none">none</option>
          </select>
        </div>

        <div class="control-group">
          <label for="safe-area-path-select-bottom">Safe area inset path</label>
          <select id="safe-area-path-select-bottom">
            <option value="fast" selected>Fast path (env)</option>
            <option value="slow-css">Slow path A (CSS var)</option>
            <option value="slow-js">Slow path B (JS layout)</option>
          </select>
        </div>
        </div>
        
        <div style="margin-top: 16px;">
          <label>Status Inspector (Bottom)</label>
          <div class="debug-box">
            <div>Active path: <span id="path-mode-output-bottom" class="highlight"></span></div>
            <div>Footer bottom padding: <span id="footer-padding-output-bottom" class="highlight"></span></div>
          </div>
          <div style="margin-top: 12px;">
            <label>Implementation details (Bottom)</label>
            <div class="code-snippet" id="code-snippet-output-bottom"></div>
          </div>
        </div>
    </div>

    <!-- Placeholder Card 1 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>

    <!-- Placeholder Card 2 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>

    <!-- Placeholder Card 3 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>

    <!-- Placeholder Card 4 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>

    <!-- Placeholder Card 5 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>

    <!-- Placeholder Card 6 -->
    <div class="card">
      <div class="placeholder-bar medium"></div>
      <div class="placeholder-bar short"></div>
      <div class="placeholder-bar full"></div>
    </div>
<div style="height: 48px;" id="footer-spacer"></div>
  </main>

  <footer id="bottom-footer" class="footer-visible pos-fixed path-fast">
    <div class="footer-content">
      FOOTER CONTENT
    </div>
  </footer>

  <script>
      // Elements
    const viewportMeta = document.getElementById('viewport-meta');
    const topHeader = document.getElementById('top-header');
      const bottomFooter = document.getElementById('bottom-footer');
    const headerSpacer = document.getElementById('header-spacer');
      const footerSpacer = document.getElementById('footer-spacer');

      // Controls
    const viewportFitSelect = document.getElementById('viewport-fit-select');
    const headerAnchorSelect = document.getElementById('header-anchor-select');
      const footerAnchorSelect = document.getElementById('footer-anchor-select');
      const safeAreaPathSelectTop = document.getElementById('safe-area-path-select-top');
      const safeAreaPathSelectBottom = document.getElementById('safe-area-path-select-bottom');

      // Status Inspector Outputs
    const metaTagOutput = document.getElementById('meta-tag-output');

  const pathModeOutputTop = document.getElementById('path-mode-output-top');
  const headerPaddingOutputTop = document.getElementById('header-padding-output-top');
  const codeSnippetOutputTop = document.getElementById('code-snippet-output-top');

  const pathModeOutputBottom = document.getElementById('path-mode-output-bottom');
  const footerPaddingOutputBottom = document.getElementById('footer-padding-output-bottom');
  const codeSnippetOutputBottom = document.getElementById('code-snippet-output-bottom');

      let topJsLayoutInterval = null;
      let bottomJsLayoutInterval = null;

      const codeSnippetsTop = {
      'fast': `/* Fast Path: Direct Evaluation */\n#top-header {\n  padding-top: env(safe-area-inset-top, 0px);\n}`,
      'slow-css': `/* Slow Path A: Custom CSS Variable + calc() */\n:root {\n  --indirect-safe-top: env(safe-area-inset-top, 0px);\n}\n#top-header {\n  padding-top: calc(var(--indirect-safe-top) + 0px);\n}`,
          'slow-js': `/* Slow Path B: JavaScript Dynamic Sync */\nfunction updateTopInset() {\n  topHeader.style.paddingTop = getComputedStyle(document.documentElement)\n    .getPropertyValue('env(safe-area-inset-top)');\n}`
        };

        const codeSnippetsBottom = {
          'fast': `/* Fast Path: Direct Evaluation */\n#bottom-footer {\n  padding-bottom: env(safe-area-inset-bottom, 0px);\n}`,
          'slow-css': `/* Slow Path A: Custom CSS Variable + calc() */\n:root {\n  --indirect-safe-bottom: env(safe-area-inset-bottom, 0px);\n}\n#bottom-footer {\n  padding-bottom: calc(var(--indirect-safe-bottom) + 0px);\n}`,
          'slow-js': `/* Slow Path B: JavaScript Dynamic Sync */\nfunction updateBottomInset() {\n  bottomFooter.style.paddingBottom = getComputedStyle(document.documentElement)\n    .getPropertyValue('env(safe-area-inset-bottom)');\n}`
    };

    const pathModeDescriptions = {
      'fast': 'Fast Path (Direct Engine Inset Binding)',
      'slow-css': 'Slow Path A (CSS Custom Property + calc() Cascade)',
      'slow-js': 'Slow Path B (JS Dynamic Reflow Sync)'
    };

    function updateState() {
      // 1. Viewport Fit
      const viewportFitVal = viewportFitSelect.value;
      viewportMeta.setAttribute('content', `width=device-width, initial-scale=1.0, viewport-fit=${viewportFitVal}`);
      metaTagOutput.textContent = `<meta name="viewport" content="${viewportMeta.getAttribute('content')}">`;

      // 2. Top Header State
      const headerAnchorVal = headerAnchorSelect.value;
      const safeAreaPathTopVal = safeAreaPathSelectTop.value;

      topHeader.className = '';
      if (headerAnchorVal === 'none') {
        topHeader.classList.remove('header-visible');
        headerSpacer.style.display = 'none';
      } else if (headerAnchorVal === 'sticky') {
        topHeader.classList.add('header-visible', 'pos-sticky');
        headerSpacer.style.display = 'none'; // Sticky headers don't need a spacer
      } else if (headerAnchorVal === 'fixed') {
        topHeader.classList.add('header-visible', 'pos-fixed');
        headerSpacer.style.display = 'block'; // Only fixed headers need spacing compensation
      }

      if (topJsLayoutInterval) {
        clearInterval(topJsLayoutInterval);
        topJsLayoutInterval = null;
        topHeader.style.paddingTop = '';
      }

      topHeader.classList.remove('path-fast', 'path-slow');
      if (safeAreaPathTopVal === 'fast') {
        topHeader.classList.add('path-fast');
      } else if (safeAreaPathTopVal === 'slow-css') {
        topHeader.classList.add('path-slow');
      } else if (safeAreaPathTopVal === 'slow-js') {
        const runTopJSPath = () => {
          topHeader.style.paddingTop = getComputedStyle(document.documentElement).getPropertyValue('env(safe-area-inset-top)') || '0px';
        };
        runTopJSPath();
        topJsLayoutInterval = setInterval(runTopJSPath, 500);
      }

      pathModeOutputTop.textContent = pathModeDescriptions[safeAreaPathTopVal];
      codeSnippetOutputTop.textContent = codeSnippetsTop[safeAreaPathTopVal];

      // 3. Bottom Header State
      const footerAnchorVal = footerAnchorSelect.value;
      const safeAreaPathBottomVal = safeAreaPathSelectBottom.value;

      bottomFooter.className = '';
      if (footerAnchorVal === 'none') {
        bottomFooter.classList.remove('footer-visible');
        footerSpacer.style.display = 'none';
      } else if (footerAnchorVal === 'sticky') {
        bottomFooter.classList.add('footer-visible', 'pos-sticky');
        footerSpacer.style.display = 'none'; // Sticky footers don't need a spacer
      } else if (footerAnchorVal === 'fixed') {
        bottomFooter.classList.add('footer-visible', 'pos-fixed');
        footerSpacer.style.display = 'block'; // Only fixed footers need spacing compensation
      }

      if (bottomJsLayoutInterval) {
        clearInterval(bottomJsLayoutInterval);
        bottomJsLayoutInterval = null;
        bottomFooter.style.paddingBottom = '';
      }

      bottomFooter.classList.remove('path-fast', 'path-slow');
      if (safeAreaPathBottomVal === 'fast') {
        bottomFooter.classList.add('path-fast');
      } else if (safeAreaPathBottomVal === 'slow-css') {
        bottomFooter.classList.add('path-slow');
      } else if (safeAreaPathBottomVal === 'slow-js') {
        const runBottomJSPath = () => {
          bottomFooter.style.paddingBottom = getComputedStyle(document.documentElement).getPropertyValue('env(safe-area-inset-bottom)') || '0px';
        };
        runBottomJSPath();
        bottomJsLayoutInterval = setInterval(runBottomJSPath, 500);
      }

      pathModeOutputBottom.textContent = pathModeDescriptions[safeAreaPathBottomVal];
      codeSnippetOutputBottom.textContent = codeSnippetsBottom[safeAreaPathBottomVal];

      // Measure computed paddings
      setTimeout(() => {
        headerPaddingOutputTop.textContent = window.getComputedStyle(topHeader).paddingTop || '0px';
        footerPaddingOutputBottom.textContent = window.getComputedStyle(bottomFooter).paddingBottom || '0px';
      }, 50);
    }

    viewportFitSelect.addEventListener('change', updateState);
    headerAnchorSelect.addEventListener('change', updateState);
      footerAnchorSelect.addEventListener('change', updateState);
      safeAreaPathSelectTop.addEventListener('change', updateState);
      safeAreaPathSelectBottom.addEventListener('change', updateState);

    updateState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>

</html>
