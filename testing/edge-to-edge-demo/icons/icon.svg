<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  
  <!-- Outer Device Body -->
  <rect x="96" y="48" width="320" height="416" rx="40" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  
  <!-- Edge to Edge Screen -->
  <rect x="112" y="64" width="288" height="384" rx="28" fill="#ffffff"/>
  
  <!-- Top Pink Safe Area Header -->
  <rect x="112" y="64" width="288" height="60" rx="28" fill="#fce7f3"/>
  <rect x="112" y="100" width="288" height="24" fill="#fce7f3"/>
  <line x1="112" y1="124" x2="400" y2="124" stroke="#f472b6" stroke-dasharray="6,6" stroke-width="3"/>
  <text x="256" y="96" font-family="sans-serif" font-weight="bold" font-size="16" fill="#db2777" text-anchor="middle">EDGE TO EDGE</text>
  
  <!-- Center Mock Card -->
  <rect x="136" y="148" width="240" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="156" y="172" width="140" height="16" rx="8" fill="#3b82f6"/>
  <rect x="156" y="200" width="200" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="156" y="220" width="160" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="156" y="250" width="100" height="36" rx="10" fill="#ec4899"/>
  <text x="206" y="273" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">INSTALL</text>
  
  <!-- Bottom Pink Safe Area Footer -->
  <rect x="112" y="388" width="288" height="60" rx="28" fill="#fce7f3"/>
  <rect x="112" y="388" width="288" height="24" fill="#fce7f3"/>
  <line x1="112" y1="388" x2="400" y2="388" stroke="#f472b6" stroke-dasharray="6,6" stroke-width="3"/>
  <text x="256" y="424" font-family="sans-serif" font-weight="bold" font-size="16" fill="#db2777" text-anchor="middle">SAFE AREA</text>
</svg>
